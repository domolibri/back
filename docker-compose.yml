version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: domolibri_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AdminPassword123!
      POSTGRES_DB: domolibri_db
    ports:
      - "5432:5432" # Maps container port to local host port
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    container_name: domolibri_api
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      # Overrides the connection string in appsettings.json
      - ConnectionStrings__DefaultConnection=Host=db;Database=domolibri_db;Username=postgres;Password=AdminPassword123!
    depends_on:
      - db

volumes:
  postgres_data: