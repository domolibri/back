services:
  # 1. Banco de Dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: domolibri_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AdminPassword123!}
      POSTGRES_DB: ${DB_NAME:-domolibri_db}
    ports:
      - "127.0.0.1:5432:5432" # Restricted to localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Servidor SMTP de Testes (Mailpit)
  mailpit:
    image: axllent/mailpit
    container_name: domolibri_mailpit
    ports:
      - "127.0.0.1:8025:8025" # Interface Web restrita a localhost
      - "1025:1025" # Porta SMTP interna
    environment:
      MP_MAX_MESSAGES: 500

  # 3. Backend .NET 8 API
  api:
    container_name: domolibri_api
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "8080:8080"
    environment:
      # String de conexão com o banco de dados
      - ConnectionStrings__DefaultConnection=Host=db;Database=${DB_NAME:-domolibri_db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-AdminPassword123!}
      
      # Variáveis de ambiente para o envio de e-mail (apontando para o container do Mailpit)
      - EmailSettings__SmtpServer=mailpit
      - EmailSettings__SmtpPort=1025
      - EmailSettings__SenderName=Domo Libri Onboarding
      - EmailSettings__SenderEmail=no-reply@domolibri.com.br
      - Jwt__Secret=${JWT_SECRET:-YOUR_JWT_SECRET_KEY_MIN_32_CHARS}
    depends_on:
      - db
      - mailpit

volumes:
  postgres_data: